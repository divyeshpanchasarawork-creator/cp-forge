spring.application.name=cp-forge
server.port=${PORT:8080}

# H2 in-memory DB for local testing
spring.datasource.url=jdbc:h2:mem:cpforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=cp_forge
spring.flyway.default-schema=cp_forge
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
