<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Forge</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>CP Forge</h1>
            <p class="subtitle">Competitive Programming Dashboard</p>
        </header>

        <section class="add-profile">
            <div class="input-group">
                <input type="text" id="handleInput" placeholder="Enter Codeforces username" autocomplete="off">
                <button id="addProfileBtn" class="btn">Add Profile</button>
            </div>
            <p id="addMessage" class="message"></p>
        </section>

        <section class="profiles" id="profilesSection">
            <div class="section-header">
                <h2>Saved Profiles</h2>
                <button id="refreshAllBtn" class="btn btn-secondary">Refresh</button>
            </div>
            <div id="loadingState" class="state">Loading...</div>
            <div id="emptyState" class="state" style="display:none;">No profiles added yet. Add a Codeforces username above.</div>
            <div id="errorState" class="state" style="display:none;"></div>
            <div id="profilesList" class="profiles-list"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
