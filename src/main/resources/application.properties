spring.application.name=cp-forge
server.port=${PORT:8080}

# Default to H2 in-memory for local/testing; override with env vars for production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:cpforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Connection pool
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.connection-timeout=10000

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=cp_forge
spring.flyway.default-schema=cp_forge
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
