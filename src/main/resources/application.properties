
spring.application.name=cp-forge
server.port=${PORT:8080}

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.gipadqktzleylhfuaxau.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Hello@world1626
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# Health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# Flyway: isolate CP Forge tables
spring.flyway.enabled=true
spring.flyway.schemas=cp_forge
spring.flyway.default-schema=cp_forge
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Hibernate validates the schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
